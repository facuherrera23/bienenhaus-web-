<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://rnldqiwwzhjnurkguihu.supabase.co https://api.cloudinary.com; frame-src 'none';">
  <meta name="robots" content="noindex, nofollow">
  <title>Bienenhaus Admin - Panel de Administración</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
  <!-- Google Fonts: Bienenhaus (Subject-anchored) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Admin Styles -->
  <link rel="stylesheet" href="/src/styles/admin.css">
  <!-- Main Entry Point (modular) -->
  <script type="module" src="/src/admin/main.ts"></script>
</head>
<body class="login-page" id="app">
  <!-- ================================================================
     LOGIN VIEW
     ================================================================ -->
  <div class="login-container" id="loginView">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">
        <i class="fas fa-building"></i>
      </div>
      <h1>Bienenhaus Admin</h1>
      <p>Panel de Administración - Inicia sesión para continuar</p>
    </div>

    <form class="login-form" id="loginForm" novalidate>
      <div class="login-error" id="loginError" role="alert"></div>

      <div class="form-group">
        <label for="adminEmail">Email</label>
        <input type="email" id="adminEmail" name="email" required autocomplete="email" placeholder="admin@bienenhaus.com.ar">
      </div>

      <div class="form-group">
        <label for="adminPassword">Contraseña</label>
        <input type="password" id="adminPassword" name="password" required autocomplete="current-password" placeholder="••••••••">
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <i class="fas fa-sign-in-alt"></i>
        <span>Iniciar Sesión</span>
      </button>
