<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d0e">
  <meta name="description" content="La página que buscás no existe. Volvé a nuestra portada y encontrá tu próximo hogar en Córdoba.">
  <meta name="robots" content="noindex, nofollow">
  <title>Página no encontrada · Bienenhaus Propiedades</title>
  <link rel="icon" type="image/x-icon" href="/bienenhaus-web-/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08090b;
      --surface: rgba(20, 22, 26, 0.7);
      --border: rgba(255, 255, 255, 0.08);
      --text: #ffffff;
      --text-muted: #9a9a9a;
      --accent: #20b8ab;
      --accent-dark: #178c81;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      background-image:
        radial-gradient(circle at 20% 20%, rgba(32, 184, 171, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(32, 184, 171, 0.05) 0%, transparent 50%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .container {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--surface);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 32px;
      animation: fadeUp 0.6s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 24px;
      display: block;
      filter: drop-shadow(0 0 24px rgba(32, 184, 171, 0.25));
    }
    .code {
      font-family: 'Space Grotesk', monospace;
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent) 0%, #4dd1c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.4rem, 4vw, 1.75rem);
      font-weight: 600;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 32px;
      max-width: 380px;
      margin-left: auto;
      margin-right: auto;
    }
    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #fff;
      box-shadow: 0 8px 24px rgba(32, 184, 171, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(32, 184, 171, 0.35);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
    }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .suggestions {
      margin-top: 36px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      text-align: left;
    }
    .suggestions-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .suggestions ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .suggestions a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .suggestions a:hover {
      background: rgba(32, 184, 171, 0.08);
      color: var(--accent);
    }
    .suggestions a::before {
      content: '→';
      color: var(--accent);
      font-weight: 600;
    }
    .footer {
      margin-top: 24px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    @media (max-width: 480px) {
      .container { padding: 36px 24px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; justify-content: center; }
    }
 </style>
</head>
<body>
  <main class="container" role="main">
    <img src="/bienenhaus-web-/BienenhausBHBlanco512x512.png" alt="Bienenhaus" class="logo" width="72" height="72">
    <div class="code" aria-hidden="true">404</div>
    <h1>Página no encontrada</h1>
    <p>La propiedad que buscás se mudó, fue vendida o nunca existió. Te ayudamos a volver al camino</p>

    <div class="actions">
      <a href="/bienenhaus-web-/" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z</path>
          <polyline points="9 22 9 12 15 12 15 22</polyline>
       </svg>
        Ir al inicio
     </a>
      <button type="button" class="btn btn-secondary" onclick="window.history.back()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6</path>
       </svg>
        Volver atrás
     </button>
   </div>

    <nav class="suggestions" aria-label="Páginas sugeridas">
      <div class="suggestions-label">También te puede interesar</div>
      <ul>
        <li><a href="/bienenhaus-web-/#catalogo">Ver propiedades en venta y alquiler</a</li>
        <li><a href="/bienenhaus-web-/#contacto">Contactar con un agente</a</li>
        <li><a href="/bienenhaus-web-/#nosotros">Conocé nuestra historia</a</li>
     </ul>
   </nav>

    <p class="footer">¿Necesitás ayuda? Escribinos a <a href="mailto:bienenhaus.propiedades@gmail.com" style="color: var(--accent); text-decoration: none;">bienenhaus.propiedades@gmail.com</a</p>
 </main>

  <script>
    if (window.location.pathname !== '/bienenhaus-web-/') {
      try { sessionStorage.setItem('redirect', window.location.href); } catch (e) {}
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => reg.update()).catch(() => {});
    }
 </script>
</body>
</html>
