# .github/workflows/lighthouse.yml
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
       
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
           
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
           
      - name: Install dependencies
        run: npm ci
         
      - name: Build (base=/ for CI testing)
        run: VITE_BASE_PATH=/ npm run build
         
      - name: Create CI index.html with relaxed CSP
        run: |
          cp dist/index.html dist/index-ci.html
          # Replace CSP meta tag with permissive version
          sed -i 's|<meta http-equiv="Content-Security-Policy" content="[^"]*">|<meta http-equiv="Content-Security-Policy" content="default-src * '"'"'unsafe-inline'"'"' '"'"'unsafe-eval'"'"' data: blob:; script-src * '"'"'unsafe-inline'"'"' '"'"'unsafe-eval'"'"'; style-src * '"'"'unsafe-inline'"'"'; font-src * data:; img-src * data: blob:; connect-src *; frame-src *;">|' dist/index-ci.html
          # Replace admin.html too
          cp dist/admin.html dist/admin-ci.html
          sed -i 's|<meta http-equiv="Content-Security-Policy" content="[^"]*">|<meta http-equiv="Content-Security-Policy" content="default-src * '"'"'unsafe-inline'"'"' '"'"'unsafe-eval'"'"' data: blob:; script-src * '"'"'unsafe-inline'"'"' '"'"'unsafe-eval'"'"'; style-src * '"'"'unsafe-inline'"'"'; font-src * data:; img-src * data: blob:; connect-src *; frame-src *;">|' dist/admin-ci.html
           
      - name: Start preview server
        run: |
          npx serve dist -p 3000 -s > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
           
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://localhost:3000/index-ci.html
            http://localhost:3000/admin-ci.html
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: /usr/bin/google-chrome-stable

      - name: Kill preview server
        if: always()
        run: |
          if [ -n "$SERVER_PID" ]; then kill $SERVER_PID; fi