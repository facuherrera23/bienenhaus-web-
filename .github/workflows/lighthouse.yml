# .github/workflows/lighthouse.yml
name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build (base=/ for CI testing)
        run: VITE_BASE_PATH=/ npm run build
        
      - name: Create CI index.html with relaxed CSP
        run: |
          cp dist/index.html dist/index-ci.html
          sed -i "s|default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://unpkg.com https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://rnldqiwwzhjnurkguihu.supabase.co https://api.cloudinary.com; frame-src 'none';|default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; font-src * data:; img-src * data: blob:; connect-src *; frame-src *;|g" dist/index-ci.html
          
      - name: Start preview server
        run: |
          npx serve dist -p 3000 -s > server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          for i in {1..30}; do
            if curl -f http://localhost:3000/ > /dev/null 2>&1; then
              echo "Server ready"
              break
            fi
            sleep 1
          done
          
      - name: Debug - Check served content
        run: |
          echo "=== Index.html ==="
          curl -s http://localhost:3000/ | head -100
          echo ""
          echo "=== Checking assets ==="
          curl -s http://localhost:3000/ | grep -oP 'src="[^"]*"' | head -20
          echo ""
          echo "=== Checking CSP header ==="
          curl -sI http://localhost:3000/ | grep -i content-security-policy
          echo ""
          echo "=== Checking if JS loads ==="
          curl -s http://localhost:3000/assets/index-*.js | head -5
          
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://localhost:3000/index-ci.html
            http://localhost:3000/admin.html
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
          CHROME_PATH: /usr/bin/chromium-browser