<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin conexión - Bienenhaus Propiedades</title>
  <base href="/bienenhaus-web-/">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0b2b4a 0%, #1a4066 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
    }
    .container {
      max-width: 400px;
      text-align: center;
      padding: 40px 20px;
    }
    .icon {
      font-size: 5rem;
      margin-bottom: 24px;
      opacity: 0.8;
    }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    p {
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #1f6ed4;
      color: white;
      padding: 14px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1a5fb8;
    }
    .features {
      margin-top: 32px;
      text-align: left;
      opacity: 0.7;
      font-size: 0.875rem;
    }
    .features li {
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🏠</div>
    <h1>Sin conexión a internet</h1>
    <p>Parece que estás sin conexión. Algunas funciones pueden no estar disponibles.</p>
    <a href="/bienenhaus-web-/" class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v16M1 20h22M1 4h22M10 4v16M14 4v16M18 4v16"></path>
      </svg>
      Reintentar conexión
    </a>
    <ul class="features">
      <li><span>✓</span> Las propiedades vistas recientemente están disponibles</li>
      <li><span>✓</span> Tus favoritos se guardan localmente</li>
      <li><span>✓</span> Los formularios se envían cuando recuperes conexión</li>
    </ul>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(reg => {
        reg.update();
      });
    }
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
