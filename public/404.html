<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo...</title>
  <script>
    // SPA redirect para GitHub Pages (Project site)
    // Detecta base path automáticamente y preserva la ruta original
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Detectar base path: si el path empieza con /bienenhaus-web-, ese es el base
      var basePath = '';
      if (path.startsWith('/bienenhaus-web-')) {
        basePath = '/bienenhaus-web-';
      }
      // Para user site (sin project path), basePath queda ''
      
      // Si ya estamos en index.html con base path correcto, no redirigir
      var expectedIndex = basePath + '/index.html';
      if (path === basePath || path === basePath + '/' || path === expectedIndex) return;
      
      // Construir URL de destino
      var destination = expectedIndex + search + hash;
      
      // Guardar ruta original para que la app la recupere
      try {
        sessionStorage.setItem('spa_redirect_path', path + search + hash);
      } catch (e) {}
      
      // Redirigir
      window.location.replace(destination);
    })();
  </script>
</head>
<body>
  <p>Redirigiendo a <a href="/">inicio</a>...</p>
</body>
</html>
